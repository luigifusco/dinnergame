# Plain text only: >- folds wrapped lines into one paragraph.
# Each card prints once unless you add a positive integer "copies" field.
name: Sideplot
cards:
  - id: running-logistics
    type: running
    title: The Logistics Department
    text: >-
      Whenever plans come up, take an unusually thoughtful interest in a small
      practical detail: seating, snacks, luggage, opening hours.

  - id: running-wisdom
    type: running
    title: Borrowed Wisdom
    text: >-
      Refer back to someone's earlier, ordinary remark as though it were valuable
      advice for a different situation.

  - id: running-infrastructure
    type: running
    title: Infrastructure Enthusiast
    text: >-
      Naturally work the word "infrastructure" into unrelated conversations.
      Never use it twice within the same topic.

  - id: running-triumphs
    type: running
    title: Tiny Triumphs
    text: >-
      Find unusually small, sincere reasons to propose a toast or celebration.
      Raising a glass is enough; nobody needs to drink.

  - id: running-critic
    type: running
    title: The Unappointed Critic
    text: >-
      Offer occasional precise, positive reviews of things nobody normally reviews:
      a spoon, the lighting, the arrangement of bread.

  - id: running-tradition
    type: running
    title: Future Tradition
    text: >-
      Casually suggest that ordinary things happening tonight could become annual
      traditions. Do not push if nobody engages.

  - id: mission-forecast
    type: mission
    title: Forecast
    text: >-
      Get another player to say "umbrella." You cannot say it yourself, request
      the word, or introduce a word-guessing game.

  - id: mission-echo
    type: mission
    title: The Echo
    text: >-
      Introduce an expression that another player later uses in a different
      context. Asking them to repeat it does not count.

  - id: mission-expert
    type: mission
    title: Resident Expert
    text: >-
      Get the person on your right explaining a niche interest, then get a
      different person to ask them a follow-up question.

  - id: mission-holiday
    type: mission
    title: Holiday Committee
    text: >-
      Get two other people contributing concrete suggestions to an imaginary
      group holiday. You cannot propose the destination yourself.

  - id: mission-diagram
    type: mission
    title: Human Diagram
    text: >-
      Get someone to use an object on the table to explain something.
      You cannot suggest using props.

  - id: mission-principle
    type: mission
    title: A Matter of Principle
    text: >-
      Get two other people discussing the merits of a trivial choice: bowls
      versus plates, window versus aisle, sweet versus salty breakfast.
      Both must offer a reason, not just state a preference.
