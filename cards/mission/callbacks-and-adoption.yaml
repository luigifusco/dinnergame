type: mission
theme: Getting an idea, phrase, or reference to travel
cards:
  - id: mission-echo
    title: The Echo
    text: >-
      Introduce an expression that another player later uses in a different
      context, without asking them to repeat it.

  - id: mission-nickname
    title: It Has a Name
    text: >-
      Give a shared object or idea a nickname that someone else later uses
      without prompting.

  - id: mission-return
    title: Return Ticket
    text: >-
      Get another player to bring back a topic you introduced after the
      conversation has moved on, without reminding or asking them.

  - id: mission-reference
    title: A Shared Reference
    text: >-
      Compare something tonight to a familiar fictional character and get
      someone else to reuse the comparison later, without prompting.

  - id: mission-next-time
    title: Next Time
    text: >-
      Get someone to suggest repeating a small part of tonight at a future
      gathering, without proposing a tradition yourself.

  - id: mission-borrowed-example
    title: Your Example, Their Point
    text: >-
      Introduce a hypothetical example that someone else later uses to make a
      different point, without asking them to use it.

  - id: mission-callback
    title: The Callback
    text: >-
      Get another player to joke about a detail from your story after the topic
      changes, without asking for a joke or repeating the punchline.

  - id: mission-borrowed-recommendation
    title: Borrowed Recommendation
    text: >-
      Get someone to pass your recommendation to another guest in their own
      words, without asking them to relay it.
