type: mission
theme: Getting an idea, phrase, or reference to travel
cards:
  - id: mission-echo
    title: The Echo
    text: >-
      Introduce an unusual expression and get another player to use it in
      their own sentence.

  - id: mission-nickname
    title: It Has a Name
    text: >-
      Give an object or idea a nickname. Get another player to use it in their
      own sentence.

  - id: mission-return
    title: Return Ticket
    text: >-
      Get another player to bring back a topic you introduced after the
      conversation has moved on, without reminding or asking them.

  - id: mission-reference
    title: A Shared Reference
    text: >-
      Compare someone to a fictional character. Get another player to add a
      similarity you didn't mention.

  - id: mission-borrowed-example
    title: Your Example, Their Point
    text: >-
      Give a hypothetical example. Get another player to use it to argue a
      different point.

  - id: mission-relay
    title: Pass It On
    text: >-
      Whisper a message to another player. Get them to pass it on to a third
      player.

  - id: mission-earworm
    title: Earworm
    text: >-
      Hum a tune. Get another player to hum or sing it after you've stopped.

  - id: mission-signature-move
    title: Signature Move
    text: >-
      Invent a gesture to go with a phrase. Get another player to use both
      together.
