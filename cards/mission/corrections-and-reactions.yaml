type: mission
theme: Prompting corrections, imitation, and reactions
cards:
  - id: mission-wrong-proverb
    title: Close Enough
    text: >-
      Misquote a familiar saying and get another player to correct it.

  - id: mission-bad-arithmetic
    title: Doesn't Add Up
    text: >-
      Make a small arithmetic mistake and get another player to correct your answer.

  - id: mission-whisper
    title: Inside Voice
    text: >-
      Whisper a question and get another player to whisper their answer.

  - id: mission-looking-up
    title: Made You Look
    text: >-
      Get another player to look at the ceiling just by looking up yourself.

  - id: mission-second-hello
    title: Second Hello
    text: >-
      Get a handshake and a fist bump from the same player, in separate conversations.

  - id: mission-made-up-word
    title: New Vocabulary
    text: >-
      Use a made-up word and get another player to ask what it means.

  - id: mission-mirror-face
    title: Mirror Image
    text: >-
      Get another player to copy a facial expression you make, without asking them to.

  - id: mission-voice-control
    title: Voice Control
    text: >-
      Invent a voice command for an object on the table. Get another player to
      try it.
