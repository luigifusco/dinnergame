type: mission
theme: Setting up discoveries and small tricks with everyday objects
cards:
  - id: mission-napkin-reveal
    title: Under Wraps
    text: >-
      Hide this card inside a folded napkin. Get another player to unfold it and
      find the card.

  - id: mission-paper-flower
    title: Stop and Smell
    text: >-
      Fold a paper flower and get another player to smell it.

  - id: mission-paper-crown
    title: Your Majesty
    text: >-
      Make a paper crown and get another player to wear it.

  - id: mission-hidden-message
    title: Invisible Ink
    text: >-
      Claim a blank napkin has a hidden message. Get another player to hold it
      up to the light.

  - id: mission-pen-balance
    title: Steady Hand
    text: >-
      Balance a pen on one finger and get another player to try it.

  - id: mission-haggle
    title: Open to Offers
    text: >-
      Name a price for an object on the table. Get another player to offer you
      less.

  - id: mission-autograph
    title: Autograph, Please
    text: >-
      Get another player to sign their autograph on a napkin for you.

  - id: mission-blind-tasting
    title: Blind Tasting
    text: >-
      Get another player to taste something with their eyes closed.

  - id: mission-portrait-repair
    title: Artistic License
    text: >-
      Draw another player with an extra eye or ear. Get them to edit the
      portrait to fix it.
