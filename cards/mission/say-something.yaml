type: mission
theme: Getting someone else to say a particular word or phrase
cards:
  - id: mission-forecast
    title: Forecast
    text: >-
      Get another player to say "umbrella" without saying it yourself, asking for
      the word, or starting a guessing game.

  - id: mission-shortcut
    title: The Scenic Detour
    text: >-
      Get another player to say "shortcut" while discussing a task or journey.
      Don't say it yourself, ask for the word, or start a guessing game.

  - id: mission-nostalgia
    title: A Familiar Feeling
    text: >-
      Get someone to say "nostalgia" or "nostalgic" about a food, song, or object,
      without using or asking for either word.

  - id: mission-underrated
    title: More Credit, Please
    text: >-
      Get someone to call a food, object, or activity "underrated," without saying
      or suggesting the word yourself.

  - id: mission-depends
    title: The Exception
    text: >-
      Get another player to say "it depends" in conversation, without saying it
      first or asking them to finish a sentence.

  - id: mission-good-question
    title: Worth Asking
    text: >-
      Ask a question that gets a "that's a good question" from someone. Don't say
      the phrase first or ask them to rate your question.

  - id: mission-never-thought
    title: A New Angle
    text: >-
      Get someone to say "I never thought of that" without suggesting the phrase
      or asking them to repeat you.

  - id: mission-plot-twist
    title: An Unexpected Turn
    text: >-
      Get another player to say "plot twist" about a story or hypothetical
      situation, without saying it yourself or starting a guessing game.
