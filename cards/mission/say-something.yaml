type: mission
theme: Getting someone else to say a particular word or phrase
cards:
  - id: mission-forecast
    title: Forecast
    text: >-
      Get another player to say "umbrella." You cannot say it yourself, request
      the word, or introduce a word-guessing game.

  - id: mission-shortcut
    title: The Scenic Detour
    text: >-
      Get another player to say "shortcut" while discussing an ordinary task or
      journey. You cannot say the word, request it, or start a guessing game.

  - id: mission-nostalgia
    title: A Familiar Feeling
    text: >-
      Get someone to say "nostalgia" or "nostalgic" about a food, song, or object.
      You cannot say either word or ask them for a particular word.

  - id: mission-underrated
    title: More Credit, Please
    text: >-
      Get someone to describe a food, object, or activity as "underrated."
      You cannot say the word yourself or offer it as a suggested answer.

  - id: mission-depends
    title: The Exception
    text: >-
      Get another player to say "it depends" in a genuine conversation.
      You cannot say the phrase first or ask them to complete a sentence.

  - id: mission-good-question
    title: Worth Asking
    text: >-
      Get someone to say "that's a good question" about a harmless question you
      ask. You cannot request a judgment of your question or say the phrase first.

  - id: mission-never-thought
    title: A New Angle
    text: >-
      Get someone to say "I never thought of that" in a low-stakes discussion.
      You cannot suggest the phrase or ask them to repeat your words.

  - id: mission-plot-twist
    title: An Unexpected Turn
    text: >-
      Get another player to say "plot twist" in response to a story or clearly
      hypothetical situation. You cannot say the phrase or ask for a guessing game.
