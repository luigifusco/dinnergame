type: mission
theme: Eliciting small gestures and conversational actions
cards:
  - id: mission-diagram
    title: Human Diagram
    text: >-
      Get someone to explain something using an object on the table.

  - id: mission-shape
    title: The Shape of It
    text: >-
      Get another player to draw a shape in the air while explaining something.

  - id: mission-counting
    title: Counting On It
    text: >-
      Get another player to count at least three things on their fingers.

  - id: mission-sound
    title: The Sound Effect
    text: >-
      Get another player to add a sound effect while telling a story.

  - id: mission-look-again
    title: Look Again
    text: >-
      Get another player to point out a nice detail of the table or room you
      haven't mentioned.

  - id: mission-joint-example
    title: The Joint Story
    text: >-
      Get one player to start telling a story and another to add a detail before
      you speak again.

  - id: mission-pinky-promise
    title: Pinky Promise
    text: >-
      Get another player to make a pinky promise with you.

  - id: mission-thumb-war
    title: Thumb War
    text: >-
      Get another player to thumb-wrestle you.

  - id: mission-wish
    title: Make a Wish
    text: >-
      Get another player to close their eyes and make a wish.
