type: mission
theme: Drawing out stories, knowledge, and useful details
cards:
  - id: mission-expert
    title: Resident Expert
    text: >-
      Get another player to give you a step-by-step explanation of a skill they
      have.

  - id: mission-origin
    title: Origin Story
    text: >-
      Get someone to tell how they first learned an everyday skill.

  - id: mission-connection
    title: Unexpected Connection
    text: >-
      Find something you and another player have both done. Get them to compare
      their experience with yours.

  - id: mission-useful-tip
    title: The Useful Tip
    text: >-
      Get someone to share a practical tip that another guest says they'd like to
      try.

  - id: mission-small-victory
    title: Small Victory
    text: >-
      Get someone to tell how they solved a small household or hobby problem,
      including what finally worked.

  - id: mission-first-attempt
    title: First Attempt
    text: >-
      Get someone to tell a story about their first try at a hobby or
      recipe, including what they changed next time.

  - id: mission-recommendations
    title: The Recommendation Chain
    text: >-
      Get one player to recommend a book, show, song, or recipe and another to
      write it down or save it to a list.

  - id: mission-hot-take
    title: Hot Take
    text: >-
      Get another player to defend an unpopular food opinion of their own.

  - id: mission-laundry-symbol
    title: Handle with Care
    text: >-
      Get another player to explain a laundry symbol on something you're wearing.

  - id: mission-epitaph
    title: In Loving Memory
    text: >-
      Get another player to invent an epitaph for your gravestone.
