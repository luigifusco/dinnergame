type: running
theme: Building small recurring references and shared fictions
cards:
  - id: running-previously
    title: Previously, at This Table
    text: >-
      Recap small events from earlier as background to what's happening now.

  - id: running-shop
    title: The Imaginary Shop
    text: >-
      Invent an imaginary business selling something mentioned tonight and refer
      back to it when it fits.

  - id: running-headline
    title: Tomorrow's Headline
    text: >-
      Give minor events short, friendly headlines.

  - id: running-committee
    title: The Committee
    text: >-
      Mention an imaginary committee's opinions on trivial decisions.

  - id: running-motto
    title: A Useful Motto
    text: >-
      Invent a short motto and reuse it in later conversations, without asking
      anyone to repeat it.

  - id: running-mascot
    title: Unofficial Mascot
    text: >-
      Give an object on the table a recurring role in your comments, without
      handling anyone else's belongings.
