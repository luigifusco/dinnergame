type: running
theme: Building small recurring references and shared fictions
cards:
  - id: running-previously
    title: Previously, at This Table
    text: >-
      Occasionally recap a small earlier event as if it were the relevant
      background to what is happening now. Do not narrate continuously.

  - id: running-shop
    title: The Imaginary Shop
    text: >-
      Imagine selling one ordinary item or idea mentioned tonight. Refer back
      to this tiny business when a natural connection appears; never pretend it is real.

  - id: running-headline
    title: Tomorrow's Headline
    text: >-
      From time to time, give a minor event a short, friendly headline.
      Deliver it conversationally, not as a performance.

  - id: running-committee
    title: The Committee
    text: >-
      Refer occasionally to an imaginary committee interested in trivial
      decisions. Its opinions should be gentle and obviously fictional.

  - id: running-motto
    title: A Useful Motto
    text: >-
      Introduce a short, harmless motto of your own and bring it back when it fits
      a later topic. Do not ask anyone to repeat it.

  - id: running-mascot
    title: Unofficial Mascot
    text: >-
      Choose an ordinary object already on the table and occasionally give it a
      small role in your comments. Do not move or touch anyone else's belongings.
