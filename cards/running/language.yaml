type: running
theme: Language and verbal habits
cards:
  - id: running-wisdom
    title: Borrowed Wisdom
    text: >-
      Treat someone's earlier throwaway remark as wise advice for a different
      situation.

  - id: running-infrastructure
    title: Infrastructure Enthusiast
    text: >-
      Work the word "infrastructure" into unrelated conversations, no more than
      once per topic.

  - id: running-footnotes
    title: Quiet Footnotes
    text: >-
      Add short, unnecessary clarifications to your own perfectly clear statements.

  - id: running-conclusions
    title: Careful Conclusions
    text: >-
      Present everyday opinions as cautious conclusions: "My current theory is..."
      or "The early signs are promising."

  - id: running-overstatement
    title: Easily Impressed
    text: >-
      Praise ordinary things as if they're extraordinary.

  - id: running-metaphors
    title: Domestic Metaphors
    text: >-
      Compare unrelated situations to household chores, using a different chore
      each time.
