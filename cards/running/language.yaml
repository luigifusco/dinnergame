type: running
theme: Language and verbal habits
cards:
  - id: running-wisdom
    title: The Prophet
    text: >-
      Choose another player as your personal oracle. Quote their earlier remarks
      as predictions of whatever happens next.

  - id: running-roundabouts
    title: More Roundabouts
    text: >-
      Propose adding a roundabout as the solution to unrelated problems.

  - id: running-footnotes
    title: Contractually Obliged
    text: >-
      Add spoken fine print to your own offers, promises, and compliments,
      as if someone might sue you.

  - id: running-known-issue
    title: Known Issue
    text: >-
      Describe your own mistakes as known issues. Announce updates and
      workarounds for your behavior.

  - id: running-overstatement
    title: World-Class
    text: >-
      Praise routine actions as elite athletic performances, complete with
      technique analysis and comparisons to past champions.

  - id: running-metaphors
    title: Couples Therapy
    text: >-
      Explain unrelated problems as relationship trouble between the things
      involved.
