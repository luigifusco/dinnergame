type: running
theme: Looking at ordinary things through a particular lens
cards:
  - id: running-logistics
    title: The Logistics Department
    text: >-
      When plans come up, focus intently on one small detail: seating, snacks,
      luggage, opening hours.

  - id: running-critic
    title: The Unappointed Critic
    text: >-
      Give detailed, positive reviews of things nobody reviews: a spoon, the
      lighting, the bread arrangement.

  - id: running-museum
    title: Future Museum
    text: >-
      Wonder aloud what people decades from now will make of an object or custom
      mentioned tonight.

  - id: running-soundtrack
    title: Soundtrack Consultant
    text: >-
      Suggest a soundtrack for situations people describe, without playing music
      or asking anyone to sing.

  - id: running-design
    title: Everything Is a Design Choice
    text: >-
      Guess why everyday objects or habits are the way they are.

  - id: running-guide
    title: Local Guide
    text: >-
      Describe details of the table or room as beloved local landmarks.
