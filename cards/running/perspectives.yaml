type: running
theme: Looking at ordinary things through a particular lens
cards:
  - id: running-logistics
    title: The Heist
    text: >-
      Discuss ordinary plans as heists. Assign roles, identify the target,
      and worry about the getaway.

  - id: running-critic
    title: The Unappointed Critic
    text: >-
      Rate ordinary things using units you invent. Defend your scale as if
      everyone should already understand it.

  - id: running-human-manual
    title: Definitely Human
    text: >-
      Ask practical questions about ordinary human habits, as if you learned
      about people from an unreliable manual.

  - id: running-sound-effects
    title: Low-Budget Foley
    text: >-
      Supply sound effects for ordinary actions at the table. Give recurring
      actions their own signature sound.

  - id: running-design
    title: Hidden Features
    text: >-
      Give product demonstrations of ordinary objects, inventing features nobody
      needs.

  - id: running-wildlife
    title: Wildlife Observer
    text: >-
      Describe what people at the table do as animal behavior: feeding,
      grooming, territory, courtship.

  - id: running-safety
    title: Safety Briefing
    text: >-
      Give safety briefings before ordinary activities: pouring water, standing
      up, opening a menu.
