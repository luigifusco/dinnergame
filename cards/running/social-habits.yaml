type: running
theme: Conversation habits and recurring rituals
cards:
  - id: running-eulogies
    title: Gone Too Soon
    text: >-
      Deliver eulogies for finished dishes, empty glasses, and topics the
      conversation has abandoned.

  - id: running-tradition
    title: Ancient Tradition
    text: >-
      Invent a ritual around something that happens tonight. Later, insist it's
      a tradition you've all followed for years.

  - id: running-compliments
    title: Suspiciously Specific
    text: >-
      Compliment people on talents you've inferred from almost no evidence,
      then ask them for advice as the expert.

  - id: running-rival
    title: Old Enemy
    text: >-
      Hold a grudge against an object on the table. Blame it for setbacks and
      object whenever someone praises it.

  - id: running-middleman
    title: The Middleman
    text: >-
      Route requests and messages through another player, even when the intended
      recipient is sitting next to you.

  - id: running-fuck-marry-kill
    title: Fuck, Marry, Kill
    text: >-
      Keep proposing rounds of "fuck, marry, kill" using things mentioned in
      conversation.

  - id: running-negotiator
    title: The Negotiator
    text: >-
      Treat simple requests as hostage negotiations. Make offers, set
      conditions, and ask for proof of goodwill.

  - id: running-dibs
    title: Dibs
    text: >-
      Call dibs on things that can't be claimed: the next silence, the last
      word, the moon.
