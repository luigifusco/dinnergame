type: running
theme: Attention, enthusiasm, and connections
cards:
  - id: running-triumphs
    title: Tiny Triumphs
    text: >-
      Find tiny reasons for a toast or celebration.

  - id: running-tradition
    title: Future Tradition
    text: >-
      Suggest making ordinary things that happen tonight into annual traditions.

  - id: running-compliments
    title: The Specific Compliment
    text: >-
      Give people oddly specific compliments.

  - id: running-fan-club
    title: Quiet Fan Club
    text: >-
      Show oddly specific enthusiasm for a preference someone mentions.

  - id: running-bridge
    title: Bridge Maker
    text: >-
      Connect two different people's remarks as if their ideas obviously belong
      together.
