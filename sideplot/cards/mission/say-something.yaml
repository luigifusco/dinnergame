type: mission
theme: Getting someone else to say a particular word or phrase
cards:
  - id: mission-forecast
    title: Forecast
    text: >-
      Get another player to say "umbrella" without saying it yourself, asking for
      the word, or starting a guessing game.

  - id: mission-shortcut
    title: The Scenic Detour
    text: >-
      Get another player to say "shortcut" while discussing a task or journey.
      Don't say it yourself, ask for the word, or start a guessing game.

  - id: mission-nostalgia
    title: A Familiar Feeling
    text: >-
      Get someone to say "nostalgia" or "nostalgic" about a food, song, or object,
      without using or asking for either word.

  - id: mission-underrated
    title: More Credit, Please
    text: >-
      Get someone to call a food, object, or activity "underrated," without saying
      or suggesting the word yourself.

  - id: mission-depends
    title: The Exception
    text: >-
      Get another player to say "it depends" in conversation, without saying it
      first or asking them to finish a sentence.

  - id: mission-leftovers
    title: Tomorrow's Lunch
    text: >-
      Get another player to say "leftovers" without saying it yourself or
      asking for the word.

  - id: mission-superstition
    title: Lucky Charms
    text: >-
      Get someone to say "superstition" or "superstitious" without using or
      asking for either word.

  - id: mission-coincidence
    title: What Are the Odds?
    text: >-
      Get another player to say "coincidence" without saying it yourself or
      asking for the word.

  - id: mission-no-comment
    title: No Comment
    text: >-
      Get another player to say "no comment" without saying it yourself or
      asking for the phrase.

  - id: mission-big-number
    title: Astronomical
    text: >-
      Get another player to say a number bigger than a million, without saying
      one first.
