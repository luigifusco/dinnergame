type: running
theme: Building small recurring references and shared fictions
cards:
  - id: running-incident
    title: The Incident
    text: >-
      Choose a trivial event from tonight. Refer back to it as "the incident"
      and imply that nobody is ready to talk about it.

  - id: running-spoilers
    title: Spoiler Alert
    text: >-
      Treat other people's real-life stories as a TV series you've already
      seen. Drop hints about what happens next.

  - id: running-committee
    title: The Committee
    text: >-
      Refer decisions to an imaginary committee. Report its verdicts, including
      objections from one member who keeps causing problems.

  - id: running-motto
    title: Family Wisdom
    text: >-
      Invent a family saying that makes no sense. Quote it as advice and explain
      it differently each time.

  - id: running-mascot
    title: The Guest of Honor
    text: >-
      Treat an object on the table as an important guest. Consult it, defend its
      tastes, and include it in decisions.

  - id: running-witness-protection
    title: Witness Protection
    text: >-
      Hint that you used to live under another name. Occasionally slip up and
      correct yourself.

  - id: running-rival-dinner
    title: The Rival Dinner
    text: >-
      Claim that a rival group is having the same evening somewhere else. Keep
      reporting how you're beating them.

  - id: running-sponsor
    title: A Word from Our Sponsor
    text: >-
      Act as if tonight is sponsored by a brand you made up. Work in product
      placements.

  - id: running-conspiracy
    title: It's All Connected
    text: >-
      Link unrelated things from tonight into one conspiracy theory that keeps
      growing.
